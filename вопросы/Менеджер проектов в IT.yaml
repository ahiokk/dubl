      - текст: согласовать новый план с контрольными точками и отчитываться чаще
        слова: [новый план, новую дату, новая дата, новый срок, новые сроки, контрольн, чекпоинт, чаще отчит, чаще созван]
        добить: Что будет после того, как заказчик выберет вариант?

