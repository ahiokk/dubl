        слова: [без оправдан, не оправдыва, не ищу виноват, без поиска виноват, открыто сообщ, называ причин, причин сдвиг, на фактах, по фактам]
        добить: Как вы объясните заказчику, что произошло?
      - текст: прийти не только с проблемой, а с вариантами, урезать объём, сдвинуть дату, выпустить по частям
        слова: [предложу вариант, предлага вариант, несколько вариант, два вариант, урез объем, сократ объем, убра из релиза, сдвин дату, по частям, поэтапн]
