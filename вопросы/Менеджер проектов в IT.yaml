название: Менеджер проектов в IT, junior и middle

# Вопросы для менеджера проектов в IT, от джуна до мидла: Scrum и Kanban,
# планирование и оценка сроков, риски, работа с заказчиком и изменениями,
# метрики и конфликты в команде. Вопросы про себя и мотивацию лежат в банке
# «Общие вопросы». Банк под свою вакансию можно сделать в окне программы.

вопросы:

  - id: pm_scrum_roles
    вопрос: Какие роли есть в Scrum и за что отвечает каждая?
    категория: процессы
    уровень: 1
    цель_сек: [30, 70]
    паразитов_макс: 2
    заметка: Три роли по Scrum Guide 2020, владелец продукта, Scrum Master и разработчики. Если спросят, где в Scrum менеджер проекта, ответ такой, что отдельной роли нет.
    тезисы:
      - текст: владелец продукта отвечает за ценность продукта и приоритеты бэклога
        слова: [приоритет бэклог, приоритизир бэклог, вед бэклог, держит бэклог, владе бэклог, управля бэклог, отвечает за продукт, ценност продукт, максимизир ценност, решает что важн]
        добить: А кто решает, что команде делать в первую очередь?
      - текст: Scrum Master следит за процессом и убирает помехи, но не командует
        слова: [убира препятств, убра препятств, убира помех, убра помех, следит за процесс, не командует, не начальник, не руководител, фасилит, servant leader]
        добить: А кто в команде следит за самим процессом?
      - текст: разработчики самоуправляются, сами решают, как делать работу и сколько взять в спринт
        слова: [самоуправля, самоорганиз, self-managing, self managing, разработчики сами, разработчики решают, разработчики определяют, команда сама, сама решает, сами решают]
        добить: А кто распределяет работу между разработчиками?

  - id: pm_scrum_events
    вопрос: Какие встречи бывают в Scrum и зачем каждая нужна?
    категория: процессы
    уровень: 1
    цель_сек: [35, 80]
    паразитов_макс: 2
    заметка: Назови встречи в порядке спринта и для каждой скажи, какой результат она даёт.
    тезисы:
      - текст: планирование спринта, команда выбирает, что берёт в работу, и формулирует цель
        слова: [выбирает задачи, выбираем задачи, ставим цел, ставит цел, постав цел, определя цел, формулир цел, берет в работ, берем в работ, берем в спринт]
        добить: С чего начинается спринт?
      - текст: дейли, 15 минут в день, команда сверяет прогресс к цели спринта и план на день
        слова: [15 минут, пятнадцать минут, коротк синхронизац, ежедневн синхронизац, синхронизац команд, прогресс к цел, план на день, сверя прогресс, сверяем план, как идем к цел]
        добить: Как команда каждый день сверяется между собой?
      - текст: ревью спринта, показываем результат заказчику и решаем, что менять дальше
        слова: [демо, демонстрир, инкремент, показыва заказчик, показыва готов, показыва результат, показыва что сдела, показыва что получил, показ результат, показ заказчик]
        добить: А как заказчик участвует в спринте?
      - текст: ретроспектива, команда разбирает, что улучшить в работе
        слова: [улучш, что пошло не так, стат лучше, работат лучше, извлека урок, выводы]
        добить: Есть ли в конце спринта встреча только для самой команды?

  - id: pm_triangle
    вопрос: Что такое треугольник ограничений проекта?
    категория: планирование
    уровень: 1
    цель_сек: [25, 60]
    паразитов_макс: 2
    заметка: Назови три угла и главное следствие, что менять один можно только за счёт других.
    тезисы:
      - текст: три параметра, объём работ, сроки и бюджет
        слова: [скоуп, scope, объем работ, срок бюджет, срок и бюджет, бюджет срок, бюджет и срок, время и деньги, три ограничения]
        добить: Что находится в углах этого треугольника?
      - текст: параметры связаны, изменение одного бьёт по остальным
        слова: [не затронув, затронут, затрагива, влияет на остальн, влияет на друг, друг от друга, тянет за собой, взаимосвяз, страдает, пожертвова]
        добить: Что будет с остальными параметрами, если заказчик просит сдвинуть один из них?
      - текст: обычно жёстко держат два параметра, третий остаётся гибким
        слова: [два из трех, двух из трех, два параметра, два жестк, два фиксир, третий гибк, третий парамет, один гибк]
        добить: Можно ли жёстко держать сразу все три параметра?

  - id: pm_decompose
    вопрос: Как вы разбиваете большой проект на задачи?
    категория: планирование
    уровень: 1
    цель_сек: [35, 80]
    паразитов_макс: 2
    заметка: Покажи путь от большого к мелкому и скажи, когда пора остановиться.
    тезисы:
      - текст: идём от результата к крупным блокам и дробим дальше
        слова: [декомпоз, wbs, вбс, структур работ, дерев работ, дерев задач, эпик, epic, на этапы]
        добить: С чего вы начнёте, если проект большой и непонятно, как к нему подступиться?
      - текст: дробим до задач, которые можно оценить и взять в работу
        слова: [достаточно мелк, достаточно маленьк, можно оценить, реально оценить, поддается оценке, максимум пар дней, не больше пар дней, за пар дней, день-два, два-три дня]
        добить: До какого размера имеет смысл дробить задачи?
      - текст: для каждой части определяем критерии готовности
        слова: [критери готов, критери приемк, критери принят, definition of done, acceptance criteria, что значит готово, считается готовым, считать готовым]
        добить: Как понять, что часть работы действительно закончена?

  - id: pm_risk_register
    вопрос: Как вы работаете с рисками на проекте?
    категория: риски
    уровень: 1
    цель_сек: [40, 90]
    паразитов_макс: 2
    заметка: Риск это то, что ещё не случилось. Когда уже случилось, это проблема, и работа с ней другая.
    тезисы:
      - текст: заранее выявляем риски и записываем в реестр
        слова: [реестр, risk register, список риск, журнал риск, выявля, выявить, выявлени, идентифиц, брейншторм]
        добить: Что вы делаете с рисками в самом начале проекта?
      - текст: оцениваем вероятность и последствия, чтобы понять, чем заниматься первым
        слова: [вероятност, ущерб, матриц риск, ранжир, серьезност, оцени последств, оценива последств]
        добить: Как понять, какие риски важнее?
      - текст: для значимых рисков выбираем реакцию, избежать, снизить, передать или принять
        слова: [митигац, реагирован, запасной план, снижа вероятност, снизи вероятност, снижа риск, снизи риск, избежа риск, избега риск, перекладыва]
        добить: Что вы делаете с риском, когда он найден и оценён?
      - текст: у риска есть владелец, список регулярно пересматриваем
        слова: [владел риск, ответствен за риск, назнача владельц, пересматрива список, пересматрива реестр, список пересматрива, реестр пересматрива, пересматрива риск, актуализир, регулярно обновля]
        добить: Что происходит с этим списком потом, когда проект уже идёт?

  - id: pm_estimate
    вопрос: Как вы оцениваете сроки, если задача новая и команда такого ещё не делала?
    категория: планирование
    уровень: 2
    цель_сек: [45, 100]
    паразитов_макс: 3
    заметка: Не называй одну цифру. Диапазон и запас говорят о зрелости больше, чем уверенное число.
    тезисы:
      - текст: оценку дают те, кто будет делать, а не менеджер сам
        слова: [команда оценива, оценива команда, разработчик оценива, оценива разработчик, команду оцен, оценк команд, оценк дают те, оценк дает команд, оценк должн дава команд, спрошу у команд]
        добить: Кто должен давать оценку по такой задаче?
      - текст: честно говорим о неопределённости, оценка диапазоном, а не одной цифрой
        слова: [диапазон, вилк, три точки, оптимистичн и пессимистичн, оптимистичн пессимистичн, оптимистичн реалистичн, планпокер, покер, неопределенност]
        добить: Как вы называете срок, если многое пока непонятно?
      - текст: закладываем буфер на непредвиденное
        слова: [буфер, запас времени, запас по времени, запас на риск, запас на непредвиден, резерв времени, резерв на риск, подушк, непредвиден]
        добить: А если что-то пойдёт не по плану, как это отражается в сроке?
      - текст: сначала короткое исследование или прототип, потом уточняем оценку
        слова: [спайк, spike, прототип, пилот, исследовательск, ресерч, research, уточн оценк, пересматрива оценк, пересмотр оценк]
        добить: Что происходит с оценкой, когда работа уже идёт и становится понятнее?

  - id: pm_kanban
    вопрос: Что такое Kanban и чем он отличается от Scrum?
    категория: процессы
    уровень: 2
    цель_сек: [40, 90]
    паразитов_макс: 2
    заметка: Сравнивай по сути, поток против итераций. Про WIP-лимиты скажи обязательно, это главный признак Kanban.
    тезисы:
      - текст: доска с колонками, вся работа видна, задача движется слева направо
        слова: [колонк, слева направо, визуализ, карточк, канбан доск, канбан-доск, kanban board]
        добить: Как в Kanban выглядит работа команды, что у вас перед глазами?
      - текст: нет спринтов, работа идёт непрерывным потоком
        слова: [нет спринт, без спринт, спринтов нет, без итераци, нет итераци, непрерывн, по мере готовност, по мере освобожден, не привязан]
        добить: Как в Kanban устроено время, есть ли итерации?
      - текст: WIP-лимиты ограничивают число задач в работе
        слова: [лимит задач, лимит на колонк, лимит на количеств, ограничиваем количеств, ограничиваем числ, ограничен незаверш, ограничен числ задач, ограничен количеств задач, одновременно в работе, не копи]
        добить: Что в Kanban не даёт команде набрать слишком много задач сразу?
      - текст: по доске видны узкие места, где задачи застревают
        слова: [узкое место, узкие места, узких мест, узкого места, застрева, скопля, заторы, bottleneck, горлышко]
        добить: Как в Kanban видят, где процесс тормозит?

  - id: pm_change_request
    вопрос: Заказчик посреди спринта просит добавить новую функцию. Что вы сделаете?
    категория: стейкхолдеры
    уровень: 2
    цель_сек: [45, 110]
    паразитов_макс: 2
    заметка: Не говори ни «да», ни «нет» сразу. Порядок такой, понять зачем, оценить цену, решить, записать.
    тезисы:
      - текст: не соглашаюсь сразу, выясняю, зачем это нужно и насколько срочно
        слова: [зачем это нужно, зачем нужн, зачем ему, зачем заказчик, какую проблему решает, какую задачу решает, насколько срочн, насколько это срочн, насколько критичн, насколько важн]
        добить: Вы сразу согласитесь или сначала о чём-то спросите?
      - текст: оцениваем влияние на сроки и остальной объём
        слова: [влияние на срок, влияет на срок, повлияет на срок, как повлияет, сколько займет, сколько времени займ, оценить трудозатрат, оценить влияние, оцениваем влияние, что сдвинет]
        добить: Что вы будете выяснять у команды перед ответом заказчику?
      - текст: молча в спринт не втискиваем, либо в бэклог на потом, либо меняем на равноценное
        слова: [в бэклог, в беклог, в backlog, следующ спринт, взамен, убра из спринт, убира из спринт, обменя, не лом спринт]
        добить: Куда денется эта функция и что будет со спринтом?
      - текст: фиксируем изменение письменно и получаем подтверждение
        слова: [change request, чейндж, запрос на изменен, письменно, в письменном, документир, подтверждение заказчик, согласовать изменени]
        добить: Как вы оформите такое изменение, чтобы потом не было споров?

  - id: pm_team_metrics
    вопрос: Какие метрики команды вы смотрите и зачем?
    категория: команда
    уровень: 2
    цель_сек: [40, 100]
    паразитов_макс: 2
    заметка: Метрики нужны для прогноза и разговора о процессе. Скажи, что оценивать людей по цифрам нельзя.
    тезисы:
      - текст: скорость команды (velocity) нужна для прогноза, сколько успеем
        слова: [для прогноз, прогнозиров, прогнозиру, сколько успева, сколько успеем, сколько команда успева, сколько команда делает, сколько закрыва, сколько стори поинт, сколько story point]
        добить: Как вы понимаете, сколько работы команда успевает за спринт?
      - текст: метрики потока, lead time считаем с появления задачи, cycle time с начала работы над ней, throughput это число задач за период
        слова: [cycle time, сайкл тайм, цикл тайм, lead time, лид тайм, лидтайм, время цикла, throughput, пропускная способност, задач за период]
        добить: Как измерить, быстро ли задачи доходят до результата?
      - текст: качество, баги, дефекты, возвраты на доработку
        слова: [багов, баги, дефект, переоткры, возвраща на доработк, возврат на доработк, качеств продукт, escaped]
        добить: Как вы следите за качеством того, что делает команда?
      - текст: метрики не для оценки людей и не для сравнения команд, иначе начнут подгонять цифры
        слова: [подгон, накрут, гудхарт, гудхард, не сравнива, нельзя сравнива, не для оценк, не оценива люд, нельзя оценива, ради цифр]
        добить: Есть ли у метрик подводные камни?

  - id: pm_team_conflict
    вопрос: Два разработчика поругались, и это уже мешает работе. Что вы сделаете?
    категория: команда
    уровень: 2
    цель_сек: [40, 110]
    паразитов_макс: 2
    заметка: Говори про факты и общую цель. Вставать на чью-то сторону не нужно.
    тезисы:
      - текст: поговорить с каждым отдельно, выслушать и выяснить факты
        слова: [по отдельност, отдельно с каждым, с каждым отдельно, выслуша, точк зрени, один на один, 1 на 1]
        добить: С кого вы начнёте и в каком формате?
      - текст: понять, что стоит за конфликтом, спор по делу или личное
        слова: [причин конфликт, причин разногласи, в чем причин, реальн причин, настоящ причин, из-за чего конфликт, из-за чего возник, из-за чего спор, корн конфликт, личное от рабочего]
        добить: Как вы поймёте, что стоит за этим конфликтом?
      - текст: свести вместе и договориться о правилах, опираясь на общую цель
        слова: [общ цель, общ цели, свести вместе, свожу, втроем, посредник, медиатор, обоих вместе, собер обоих]
        добить: Что будете делать дальше, когда выслушали обоих?
      - текст: если не помогло, эскалация руководителю или разные задачи
        слова: [эскалир, эскалац, разведу, развести, разн задач, подключ руководител]
        добить: А если после этого они всё равно не договорились?

  - id: pm_status_report
    вопрос: Как вы отчитываетесь о ходе проекта перед заказчиком и руководством?
    категория: стейкхолдеры
    уровень: 2
    цель_сек: [40, 90]
    паразитов_макс: 2
    заметка: Если опыта с заказчиком пока нет, расскажи, как построил бы отчёт, например для учебного проекта.
    тезисы:
      - текст: регулярно и в одном формате, например раз в неделю
        слова: [раз в недел, раз в две недел, каждую недел, каждую пятниц, по пятниц, еженедельн, един формат, в одном формат, по шаблон, регулярн отчет]
        добить: Как часто и в каком виде заказчик получает от вас новости?
      - текст: в отчёте что сделано, что дальше и что мешает или рискованно
        слова: [что сделано, сделали за недел, сделан за недел, что в планах, что планируем, на следующ недел, риск и проблем, проблем и риск, блокер и риск, светофор]
        добить: Что именно вы пишете в таком отчёте?
      - текст: цифры и даты, прогресс относительно плана, а не ощущения
        слова: [план факт, план-факт, процент готовност, бернаун, берндаун, burndown, относительно плана, оставшийся объем, оставшихся задач, цифрами]
        добить: Как заказчик поймёт, что проект идёт по плану, а не просто на словах?
      - текст: для разной аудитории разная глубина, руководству коротко
        слова: [аудитор, уровень детал, разный уровень, саммари, summary, выжимк, краткая сводка, краткую сводку, для руководства коротко]
        добить: Одинаковый ли отчёт получают заказчик и руководство?

  - id: pm_slip
    вопрос: Вы видите, что релиз сорвётся на две недели. Как вы скажете об этом заказчику?
    категория: стейкхолдеры
    уровень: 3
    цель_сек: [45, 130]
    паразитов_макс: 3
    заметка: Начни с того, когда скажешь. Потом факты, варианты и новый план. Оправданиями не начинай. Людей в поздно горящий релиз добавлять не предлагай, это замедляет.
    тезисы:
      - текст: сообщить как можно раньше и лично, а не ждать последнего дня
        слова: [как можно раньше, не буду тян, не откладыва, не буду откладыва, не затягива, как только пойму, как только узна, сразу сообщ, сразу позвон]
        добить: Когда именно вы об этом сообщите?
