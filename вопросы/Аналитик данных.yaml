      - текст: ошибка первого рода это увидеть эффект, которого нет, вероятность альфа
        слова: [ложноположит, ложное срабатыван, ложная тревог, ложную тревог, false positive, альфа, которого нет, хотя эффекта нет, хотя она верна, отверг верн]
        добить: Какую ошибку вы допустите, если выкатите изменение, которое на самом деле ничего не даёт?
      - текст: ошибка второго рода это пропустить реальный эффект, вероятность бета, мощность это один минус бета
        слова: [ложноотрицат, ложн отрицат, false negative, бета, мощност теста, пропусти, не заметили, не увидели, хотя она неверна, хотя эффект есть]
        добить: А если эффект на самом деле есть, но тест его не показал?
      - текст: между ошибками компромисс, при той же выборке строже альфа значит больше бета, снизить обе можно только большей выборкой или снижением дисперсии (CUPED)
        слова: [увелич выборк, увелич размер, больш выборк, больше пользователей, больше наблюдений, набрать больше, cuped, снизить дисперс]
