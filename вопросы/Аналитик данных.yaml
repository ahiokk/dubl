        добить: Что на самом деле означает p-value 0,03?
      - текст: подглядывание, остановка при первой значимости раздувает долю ложных срабатываний
        слова: [подгляд, подсматр, peeking, пикинг, преждевремен, заглядыва, множественн, нельзя останавлива, не останавлива, ложн срабатыван]
        добить: Что не так с тем, чтобы смотреть на тест каждый день?
      - текст: дождаться заранее рассчитанной выборки и срока либо применять последовательные методы с поправкой
        слова: [дожда, дождем, рассчитанн, последовательные метод, последовательных метод, последовательный тест, sequential, секвенц, поправк, запланирован]
