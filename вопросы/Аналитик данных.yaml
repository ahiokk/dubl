название: Аналитик данных, junior и middle

# Банк для продуктового аналитика и аналитика данных уровня junior и middle.
# Внутри: SQL, продуктовые метрики, A/B-тесты, статистика, pandas и практика
# работы с заказчиком. Вопросы идут от разминки до кейса.
# Банк под свою вакансию можно сделать в окне программы.

вопросы:

  - id: sql_join
    вопрос: Чем INNER JOIN отличается от LEFT JOIN, и когда вы берёте каждый?
    категория: SQL
    уровень: 1
    цель_сек: [35, 75]
    паразитов_макс: 2
    заметка: Объясняй на примере клиентов и заказов, а не кружками Эйлера. Плюс к ответу, если знаешь ловушку с фильтром по правой таблице в WHERE.
    тезисы:
      - текст: INNER JOIN оставляет только строки, у которых нашлась пара в обеих таблицах
        слова: [обеих таблиц, обеих сторон, совпавш, совпадающ, только совпад, пересечен, нашлась пара, нашлось совпад, есть соответств, совпали]
        добить: Какие строки останутся в результате INNER JOIN?
      - текст: LEFT JOIN сохраняет все строки левой таблицы, где пары нет, там будут пустые значения
        слова: [лев таблиц, из лев, всю лев, все из перв, все строки из перв, все записи из перв, слева, справа ничего, справа нет, справа не нашлось]
        добить: А что будет со строкой, для которой во второй таблице пары нет?
      - текст: LEFT нужен, чтобы не потерять строки без пары, например клиентов без заказов
        слова: [без заказов, без заказа, без покупок, не потерять, не потеря, нельзя терять, нельзя потерять, не было заказов, нет заказов, ни одного заказ]
        добить: В какой задаче без LEFT JOIN не обойтись?

  - id: sql_having
    вопрос: Чем WHERE отличается от HAVING?
    категория: SQL
    уровень: 1
    цель_сек: [30, 65]
    паразитов_макс: 2
    заметка: Главное это порядок выполнения. Сначала WHERE, потом группировка, потом HAVING.
    тезисы:
      - текст: WHERE фильтрует отдельные строки до группировки
        слова: [до группировк, до групбай, до гроуп, до group, перед группировк, перед групбай, до агрегации, до агрегирования, до того как сгруппир, до того как мы сгруппир]
        добить: В какой момент выполнения запроса отрабатывает WHERE?
      - текст: HAVING фильтрует уже готовые группы по агрегатам, вроде суммы или количества
        слова: [после груп, после гроуп, после group, после агрегац, после того как сгруппир, после того как мы сгруппир, агрегатам, агрегированн, сгруппирован, условие на сумм]
        добить: Как отфильтровать клиентов, у которых сумма заказов больше заданной?
      - текст: обычные условия по столбцам лучше держать в WHERE, так запрос читает меньше строк
        слова: [по обычн, по столбц, по полям, обычные услов, простые услов, обычные фильтры, меньше строк, where быстрее, вэр быстрее, where работает быстрее]
        добить: Куда лучше поставить условие по дате или стране, в WHERE или в HAVING, и почему?

  - id: sql_window
    вопрос: Что такое оконные функции и чем они отличаются от GROUP BY?
    категория: SQL
    уровень: 2
    цель_сек: [40, 90]
    паразитов_макс: 3
    заметка: Ключевая разница в числе строк на выходе. Назови хотя бы два примера, которыми пользовался сам.
    тезисы:
      - текст: оконная функция считает по набору строк, но не схлопывает их, строк на выходе столько же
        слова: [не схлопыва, не сворачива, не склеива, не сжима, не группиру, остаются все, остаются строки, строки не пропада, строк не меня, столько же строк]
        добить: Сколько строк будет на выходе по сравнению со входом?
      - текст: окно задаётся через OVER, PARTITION BY и ORDER BY
        слова: [partition, партишн, партиш, партиц, через over, через овер, окно задается, окно определя]
        добить: Как в запросе указать, по каким строкам и в каком порядке считать?
      - текст: примеры, номер строки в группе, нарастающий итог, значение предыдущей строки
        слова: [row_number, row number, роу намбер, ранжирован, rank, нарастающ, накопительн, скользящ, номер строк, предыдущей строк]
        добить: Какие задачи вы решали оконными функциями?

  - id: sql_null
    вопрос: Как в SQL ведёт себя NULL? Почему условие «поле равно NULL» ничего не находит?
    категория: SQL
    уровень: 2
    цель_сек: [40, 90]
    паразитов_макс: 3
    заметка: Скажи про трёхзначную логику, true, false и unknown. Это отличает тех, кто понимает, от тех, кто выучил IS NULL.
    тезисы:
      - текст: NULL это неизвестное значение, а не ноль и не пустая строка
        слова: [неизвестн, не ноль, не нуль, не пустая строк, не пустой строк, не пустую строк, отсутстви, нет значения, не знаем что]
        добить: Что означает NULL в ячейке?
      - текст: любое сравнение с NULL даёт неизвестно, поэтому нужен IS NULL или IS NOT NULL
        слова: [is null, is not null, ис нал, ис нул, ис нот, трехзначн, сравнение с null, сравнивать с null, сравнивать с нал]
        добить: Как тогда правильно проверить, что в поле пусто?
      - текст: агрегаты, кроме COUNT(*), игнорируют NULL, а COALESCE подставляет вместо него значение
        слова: [coalesce, коалес, коалэс, игнорир null, игнорир нал, null игнорир, его игнорир, не учитыва null, не учитыва нал, подставить вместо]
        добить: Как NULL влияет на подсчёт среднего и как заменить его на нужное значение?

  - id: metric_dau_mau
