    тезисы:
      - текст: LTV это сумма, которую клиент приносит за всё время жизни
        слова: [lifetime, лайфтайм, за все время, за всю жизнь, за весь срок, срок жизни, жизни клиент, пожизненн, суммарн]
        добить: Что именно входит в LTV и за какой период?
      - текст: грубая формула, доход на пользователя умножить на срок жизни, а срок жизни это один делить на отток
        слова: [arpu, арпу, арпю, отток, churn, чурн, умножить arpu, умножить арпу, умножить на срок, средний доход]
        добить: Из каких величин складывается эта цифра?
      - текст: LTV сравнивают со стоимостью привлечения, клиент должен окупаться
        слова: [окупаемост, окупаетс, окупится, payback, в три раза, ltv к cac, ltv больше, лтв больше, должен быть больше, больше чем тратим]
        добить: Как понять, что бизнес зарабатывает на таком клиенте?

  - id: ab_errors
    вопрос: Что такое ошибки первого и второго рода в A/B-тесте?
