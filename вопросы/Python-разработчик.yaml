название: Python-разработчик, junior и middle

# Банк для вакансии Python-разработчика (бэкенд), уровни junior и middle.
# Внутри язык и его устройство, ООП и типы, асинхронность, базы данных, веб и API,
# тесты и практика. Вопросы про себя и мотивацию лежат в банке «Общие вопросы».
# Банк под свою вакансию можно сделать прямо в окне программы.

вопросы:

  - id: py_mutable
    вопрос: Чем изменяемые типы отличаются от неизменяемых и где на этом можно споткнуться?
    категория: язык
    уровень: 1
    цель_сек: [45, 90]
    паразитов_макс: 2
    заметка: Дай по два примера каждого вида и переходи к ловушкам. Про значение по умолчанию в аргументе функции спрашивают очень часто.
    тезисы:
      - текст: список, словарь и множество меняются на месте, а строка, число и кортеж нет
        слова: [кортеж, tuple, frozenset, новый объект, нового объект, новую строк, новое число]
        добить: Какие встроенные типы можно поменять на месте, а какие нет?
      - текст: присваивание копирует ссылку, а не объект, независимую копию делают через copy, а для вложенных объектов через deepcopy
        слова: [ссылк, ссыла, copy, дипкопи, поверхностн коп, глубок коп, тот же объект, того же объект]
        добить: Что будет, если присвоить список другой переменной и поменять один из двух?
      - текст: изменяемое значение по умолчанию в аргументе создаётся один раз и живёт между вызовами
        слова: [определении функци, определения функци, объявлении функци, объявления функци, создаётся один раз, создаётся только один, между вызовами, общий для всех вызов, none вместо, один раз при определ]
        добить: Вы писали функцию с необязательным параметром-списком, какой там подвох?

