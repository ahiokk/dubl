        слова: [same origin, same-origin, сэйм ориджин, сейм ориджин, одного источник, одинаков источник, разных источник, разные источник, чужой сайт, чужого сайта]
        добить: Зачем браузер вообще блокирует ответ с другого домена?
      - текст: сервер разрешает доступ заголовками вроде Access-Control-Allow-Origin, проверку делает браузер
        слова: [access control, access-control, allow origin, allow-origin, аксесс контрол, аксес контрол, аллоу ориджин, сервер разреш, разреш сервер, разрешающ заголов]
        добить: Кто в итоге решает, можно ли странице прочитать этот ответ?
      - текст: для непростых запросов браузер сначала шлёт preflight OPTIONS, чинится это настройкой сервера или прокси
        слова: [preflight, префлайт, options, опшнс, оптионс, прокси, proxy, предварительн запрос]
        добить: Перед основным запросом в сети виден ещё один, с другим методом. Что это такое?

  - id: re_rerender
    вопрос: Когда React перерисовывает компонент и как не допускать лишних перерисовок?
    категория: react
    уровень: 3
    цель_сек: [60, 120]
    паразитов_макс: 2
    заметка: Причин три, своё состояние, перерисовка родителя и смена значения контекста. Сами по себе пропсы причиной не считаются, они меняются потому, что перерисовался родитель. Лечить начинай с проверки, что реально тормозит, потом memo, useMemo и useCallback, и не мутируй состояние.
    тезисы:
      - текст: компонент рендерится заново при смене своего состояния, при перерисовке родителя (дети идут следом даже с теми же пропсами) и при смене значения контекста
        слова: [родител перерис, перерисов родител, ререндер родител, рендер родител, родител рендер, родител обнов, обновлени родител, контекст, context]
        добить: Из-за чего ещё, кроме собственного состояния, React может обновить компонент?
      - текст: состояние нельзя мутировать, нужен новый объект или массив, иначе React не заметит изменений
        слова: [не мутир, нельзя мутир, мутир нельзя, без мутац, ссылк, новый объект, новый массив, нового объект, нового массив, иммутабельн]
        добить: Как обновить объект или массив в состоянии, чтобы React это заметил?
      - текст: оптимизируют по факту, после замера в профайлере, через memo, useMemo и useCallback, а не оборачивают всё подряд, часть этой работы делает React Compiler
        слова: [профайлер, profiler, профилирован, после замер, не везде, компилятор сам, компилятор делает, compiler сам, compiler делает]
        добить: Что вы делаете, если замечаете, что список тормозит при вводе в поле?

  - id: perf_slow
    вопрос: Страница грузится долго или тормозит. Как вы разбираетесь и что обычно оказывается причиной?
    категория: производительность и сборка
    уровень: 3
    цель_сек: [70, 150]
    паразитов_макс: 3
    заметка: Начни с замера, а не с догадок. Дальше загрузка (бандл, картинки, кэш), потом поведение страницы (длинные списки, лишние обновления). Если был реальный случай, назови цифры.
    тезисы:
      - текст: сначала измерить в Lighthouse и DevTools и найти узкое место
        слова: [lighthouse, лайтхаус, devtools, девтулз, дев тулс, performance, перформанс, замер, измер]
        добить: С чего вы начнёте, прежде чем что-то менять в коде?
      - текст: уменьшают бандл, делят код на части, грузят лениво, убирают неиспользуемое
        слова: [бандл, bundle, code splitting, кодсплит, ленив, lazy, tree shaking, шейкинг, минификаци, сборщик]
        добить: Что можно сделать, если выяснится, что браузер слишком долго скачивает скрипты?
      - текст: оптимизируют картинки и шрифты, включают кэш, CDN и сжатие
        слова: [картинк, изображен, webp, вебп, кэшир, кешир, cdn, сжати, gzip, brotli]
        добить: А если дело не в коде, а в тяжёлых ресурсах, которые страница подгружает?
      - текст: в работающей странице длинные списки выводят через виртуализацию, тяжёлое откладывают и дебаунсят
        слова: [виртуализац, виртуализир, virtualiz, дебаунс, debounce, дебанс, троттл, throttl, react-window, react window]
        добить: А если страница загрузилась быстро, но тормозит в работе, например на длинном списке?
