название: ML-инженер, junior и middle

# Банк для ML-инженера уровня junior и middle: основы ML, метрики, деревья и бустинг,
# нейросети, трансформеры и LLM, вывод модели в прод. Внутри 15 вопросов
# от разминки до боевых кейсов. Заметки к вопросам показываются в окне строкой «Подсказка».
# Банк под свою вакансию можно сделать в окне программы.

вопросы:

  - id: ml_overfit
    вопрос: Что такое переобучение и как с ним бороться?
    категория: основы ML
    уровень: 1
    цель_сек: [40, 90]
    паразитов_макс: 2
    заметка: Начни с признака, на обучении хорошо, на новых данных хуже. Потом скажи, как это заметить, и назови три-четыре способа лечения.
    тезисы:
      - текст: модель заучивает обучающие данные и плохо работает на новых
        слова: [запомин, заучи, подогнал, под обучающую выборк, под обучающие данн, не обобща, плохо обобща, обобщающ, выучила шум]
        добить: Что именно происходит с моделью, когда она переобучается?
      - текст: заметить по разрыву между обучением и отложенной выборкой, кросс-валидация
        слова: [разрыв, отложенн, кросс-валидац, кросс валидац, кроссвалидац, cross-valid, кривые обучен, на валидации хуж, на тесте хуж, расхождени между]
        добить: Как вы поймёте, что модель переобучилась?
      - текст: лечат регуляризацией, данными, упрощением модели и ранней остановкой
        слова: [регуляризац, больше данных, упрощ, проще модел, ранняя остановк, ранней остановк, раннюю остановк, early stopping, аугментац, штраф]
        добить: Что можно сделать, чтобы модель переобучалась меньше?

  - id: ml_bias_var
    вопрос: Объясните bias-variance trade-off своими словами
    категория: основы ML
    уровень: 2
    цель_сек: [45, 90]
    паразитов_макс: 2
    заметка: Покажи две крайности, слишком простая модель и слишком сложная, и как меняется ошибка, когда модель усложняют.
    тезисы:
      - текст: bias, слишком простая модель не ловит закономерность
        слова: [смещени, недообуч, underfit, слишком прост, слишком примитивн, слишком слаб, не может уловить, не улавливает]
        добить: Откуда берётся ошибка у очень простой модели, например линейной на сложной зависимости?
      - текст: variance, слишком гибкая модель сильно зависит от конкретной выборки
        слова: [разброс, дисперсия, слишком гибк, слишком сложн, подстраивается под, подстраиваться под, подстроилась под, чувствительна к выборк, чувствителен к выборк, зависит от выборки]
        добить: А откуда берётся ошибка у очень гибкой модели, например глубокого дерева?
      - текст: с ростом сложности смещение падает, а разброс растёт, оптимум ищут по валидации
        слова: [компромисс, оптимум, золотая середин, золотую середин, баланс между, u-образн, кривая валидац, чем сложнее]
        добить: Как эти две ошибки связаны между собой при росте сложности модели?

  - id: ml_leak
    вопрос: Что такое утечка данных? Приведите примеры и скажите, как вы её ищете
    категория: основы ML
    уровень: 3
    цель_сек: [60, 130]
    паразитов_макс: 3
    заметка: Утечка даёт отличную метрику на валидации и провал в проде. Назови два-три разных примера, а потом способы поиска.
    тезисы:
      - текст: в обучение попадает информация, которой не будет в момент реального предсказания
        слова: [недоступн, из будущего, не будет известн, у нас не будет, подсмотр, информации из тест, информация из тест, в момент предсказан, момент реального предсказан, в момент прогноз]
        добить: Что именно считается утечкой, если сказать одной фразой?
      - текст: примеры, признак из будущего, препроцессинг до разбиения, дубликаты в обеих частях
        слова: [до разбиени, до сплит, всей выборк, дубликат, scaler, скейлер, скалер, target encoding, перемешал, один и тот же пользовател]
        добить: Приведите конкретные ошибки в работе с данными, которые к этому приводят.
      - текст: как ловят, слишком хорошая метрика, важность признаков, разбиение по времени, пайплайн внутри фолдов
        слова: [подозрительно хорош, подозрительно высок, слишком хорош, слишком высок, важност признак, дел по времен, разбиен по времен, разбиен по групп, внутри пайплайн, внутри фолд]
        добить: Что вас насторожит в результатах, если утечка есть?

