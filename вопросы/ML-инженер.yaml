  - id: tree_boost
    вопрос: Чем градиентный бустинг отличается от случайного леса?
    категория: деревья и бустинг
    уровень: 2
    цель_сек: [45, 90]
    паразитов_макс: 2
    заметка: Главное различие в порядке построения. Лес строит деревья независимо и усредняет, бустинг строит по очереди и исправляет ошибки.
    тезисы:
      - текст: в лесу деревья независимы, в бустинге строятся последовательно, одно за другим
        слова: [стро последовательн, последовательно стро, добавля последовательн, последовательно добавля, по очереди, одно за другим, друг за другом, в лесу независим, каждое следующее дерев, каждое новое дерев]
        добить: В каком порядке строятся деревья в бустинге, и в чём тут отличие от леса?
      - текст: каждое новое дерево учится на ошибках предыдущих, по антиградиенту функции потерь
        слова: [остатк, остаточн, ошибки предыдущ, ошибках предыдущ, ошибку предыдущ, антиградиент, исправляет ошибк, исправляют ошибк, исправить ошибк, residual]
        добить: Чему именно учится дерево на каждом шаге?
      - текст: бустинг капризнее леса, надо настраивать число деревьев, глубину и шаг
        слова: [числ дерев, количеств дерев, глубин дерев, гиперпараметр, капризн, подбира глубин, скорост обучен, шаг обучен, max depth, n_estimators]
        добить: Что нужно настраивать в бустинге, чтобы он не переобучился?

