  - id: met_auc
    вопрос: Что показывает ROC-AUC и когда на него нельзя полагаться?
    категория: метрики
    уровень: 2
    цель_сек: [45, 90]
    паразитов_макс: 2
    заметка: Скажи, по каким осям строится кривая и что значат 0,5 и 1. Потом объясни, почему при редком классе лучше смотреть другую кривую.
    тезисы:
      - текст: кривая строится по всем порогам, доля найденных положительных против доли ложных тревог
        слова: [tpr, fpr, все порог, всех порог, разных порог, каждого порог, по порогам, true positive rate, false positive rate, ложных тревог]
        добить: Как строится ROC-кривая, что откладывают по осям?
      - текст: AUC это площадь под кривой, вероятность правильно упорядочить пару, 0,5 это угадывание
        слова: [площад, ранжир, случайный положительн, случайного положительн, угадыван, монетк, случайн классификатор, случайн модел, 0 5 это случайн, 0 5 как случайн]
        добить: Что означает значение AUC и как его читать?
      - текст: при сильном дисбалансе смотрят PR-кривую, ROC выглядит слишком оптимистично
        слова: [pr-auc, pr auc, pr-крив, pr крив, precision-recall, precision recall, пр аук, пиар крив, пиар аук, пи ар крив]
        добить: Почему при редком положительном классе ROC-AUC может выглядеть слишком красиво?

