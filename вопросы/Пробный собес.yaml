название: Пробный собес, 3 вопроса

# Первый мок-собес для новичка, от трёх до пяти минут, подходит для любой роли
# в IT. Три мягких вопроса: о себе, о задаче, которой гордишься, и о том,
# почему выбрал профессию. Цели по времени и по заминкам щедрые, это разминка,
# а не экзамен. Банк под свою вакансию можно сделать в окне программы, а потом
# перейти к «Общим вопросам».

вопросы:

  - id: trial_about
    вопрос: Расскажите о себе в двух словах
    категория: о себе
    уровень: 1
    цель_сек: [30, 90]
    паразитов_макс: 4
    заметка: Это разминка, ошибаться можно. Скажи три вещи. Кто ты сейчас, что умеешь или делаешь лучше всего и какую работу ищешь. Хватит минуты, биографию по годам не пересказывай. Если что-то пропустишь, программа может переспросить, как живой интервьюер.
    тезисы:
      - текст: кто вы сейчас, роль или учёба
        слова: [работаю, учусь в универ, учусь в вуз, студент, выпускник, лет опыт, года опыт, разработчик, программист, тестировщик, qa, аналитик, дизайнер, инженер, менеджер, занимаюсь тестирован, занимаюсь разработк, стажир, junior, джун, middle, мидл, backend, frontend, бэкенд, фронтенд, devops, специалист]
        добить: Кем вы сейчас работаете или на кого учитесь?
      - текст: что умеете или делаете лучше всего
        слова: [я умею, умею писать, умею тестир, умею проектир, умею анализир, навык, отвечаю за, отвечал за, пишу на, я владею, я делаю, занимаюсь дизайн, занимаюсь аналитик, занимаюсь автоматизац, получается, лучше всего, сильн сторон, разбираюсь, специализир, опыт работы с]
        добить: А что у вас получается лучше всего?
      - текст: какую работу ищете
        слова: [ищу, хочу работать, хочу попасть, хочу найти, хотел бы, хотелось бы, хочется, хочу научиться, хочу расти, хочу развива, рассматриваю, интересует, в поиске, хочу стать, хочу перейти, планирую, позици, ваканси]
        добить: А какую работу вы сейчас ищете?

  - id: trial_proud
    вопрос: Расскажите о задаче или проекте, которыми вы гордитесь
    категория: поведенческий
    уровень: 1
    цель_сек: [60, 150]
    паразитов_макс: 5
    заметка: Держись схемы STAR, то есть ситуация, задача, действия, результат. Если останется время, добавь короткий вывод, что понял или сделал бы иначе. Подойдёт учебный проект, стажировка или пет-проект, громкая компания не нужна. Больше «я», меньше «мы», и хотя бы одна цифра в результате.
    тезисы:
      - текст: ситуация и задача, что нужно было решить
        слова: [нам нужно было, мне нужно было, надо было, была проблема, проблема была, проблема в том, цель была, заказчик просил, заказчик хотел, ситуация такая, стояла задача, поставили задач, задание, требовалось, нужно было, задача была, задача стояла, задача в том]
        добить: С чего всё началось и что нужно было сделать?
      - текст: что сделали лично вы
        слова: [я сделал, я сделала, я написал, я написала, я предложил, я настроил, я реализовал, я отвечал, я отвечала, моя часть, лично я, я лично, я разработ, я спроектир, я придума, я собра, я внедр, я перепис, я занима, я взя, моя задача, я сам, сам сделал, сама сделала]
        добить: А что в этом проекте сделали именно вы?
      - текст: результат, лучше с цифрой
        слова: [процент, в два раза, вдвое, сократ, ускор, вырос, увелич, снизил, сэконом, в результате, итог, быстрее, меньше ошибок]
        добить: Какой получился результат и что изменилось в цифрах?
      - текст: вывод, что поняли или сделали бы иначе
        слова: [иначе, бы по-другому, урок, вывод, сейчас бы, понял что, поняла что, по-другому, заново, научил, сделал бы, сделала бы, начинал бы, начинала бы, теперь знаю, теперь понимаю]
        добить: Что бы вы сделали по-другому, если бы начинали заново?

  - id: trial_profession
    вопрос: Почему вы выбрали эту профессию?
    категория: мотивация
    уровень: 1
    цель_сек: [30, 90]
    паразитов_макс: 4
    заметка: Расскажи короткую историю, как ты пришёл в профессию и что в ней нравится. Хорошо звучит одна честная трудность и то, как ты с ней справляешься. Фраза «всегда любил компьютеры» без примера получается слабой.
    тезисы:
      - текст: как пришли в профессию, короткая история
        слова: [пришел в, пришла в, с детства, в школе, на первом курсе, после университета, впервые, почти случайно, случайно попал, случайно приш, случайно оказал, увлекся, увлеклась, попробовал, попробовала, заинтересовал, поступил]
        добить: Как вы пришли в эту профессию?
      - текст: что нравится в работе
        слова: [мне нравится, очень нравится, особенно нравится, я люблю, люблю когда, меня радует, приятно видеть, приятно когда, кайф, затягивает, удовольств, люблю]
        добить: А что вам в ней нравится больше всего?
      - текст: что в ней непросто и как с этим справляетесь
        слова: [непросто, бывает тяжело, тяжело когда, бывает сложно, бывают сложн, бывают трудн, трудности есть, выгора, рутин, стресс когда, стресс перед, трудно, тяжело, справляюсь, справиться, не хватает]
        добить: Что в этой работе вам даётся нелегко?
