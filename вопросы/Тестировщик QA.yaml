        добить: По какому принципу вы решите, что проверять в первую очередь?
      - текст: сократить набор проверок и закрыть основное автотестами
        слова: [выборочн, сократ набор, сократ объем, сокращен, урез, минимальн набор, облегчен, запуск автотест, запуст автотест, прогон автотест]
        добить: Что поможет проверить больше за те же часы?
      - текст: сказать менеджеру, что осталось непроверенным, решение о релизе за ним
        слова: [сообщ менеджер, сообщ продакт, скаж менеджер, скаж продакт, говорю менеджер, говорю продакт, предупреж менеджер, непроверенн, не проверено, решение о релизе]
        добить: Кому и что вы скажете перед релизом?
      - текст: после релиза следить за мониторингом и догнать остаток проверок
        слова: [уже после релиза, после релиза проверим, после релиза проверю, после выкладки, после выхода, мониторинг, допров, дотестир, hotfix, хотфикс]
        добить: А что дальше, когда релиз уже вышел?

  - id: prod_bug_escaped
    вопрос: Был у вас баг, который вы пропустили, и он уехал в прод?
    категория: баги и процесс
    уровень: 3
    цель_сек: [60, 140]
    паразитов_макс: 3
    заметка: Если коммерческого опыта нет, возьми случай из учебного или своего проекта. Главное в ответе это вывод, что ты поменял в проверках после этого.
    тезисы:
      - текст: что за баг и как выяснилось, что он дошёл до пользователей
        слова: [на проде, в проде, на продакшен, в продакшен, на продакшн, в продакшн, жалоб, пожаловал, обращения в поддержку, инцидент]
        добить: Как выяснилось, что баг ушёл к пользователям?
      - текст: честная причина, почему вы его пропустили
        слова: [почему я пропустил, почему пропустил, почему не нашли, такого сценария, не было кейса, не было теста, окружение отличалось, не покрыт, разбирали, разобрали]
        добить: Почему вы не нашли его до релиза?
      - текст: что поменяли в проверках, чтобы не повторилось
        слова: [добавил кейс, добавили кейс, добавил тест, добавили тест, добавил сценарий, добавил этот сценарий, в регрессионный набор, в чек-лист, в чеклист, с тех пор]
        добить: Что поменялось в вашей работе после этого случая?

