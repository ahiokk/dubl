название: Тестировщик (QA), junior и middle

# Банк для тех, кто идёт на позицию тестировщика, от junior до middle. Пятнадцать
# вопросов: теория тестирования, тест-дизайн, баги и процесс, API, SQL, автоматизация.
# Вопросов про себя, мотивацию и зарплату здесь нет, они лежат в банке «Общие вопросы».
# Банк под свою вакансию можно сделать в окне программы, а этот файл можно скопировать
# и дописать под компанию.

вопросы:

  - id: qa_qc_testing
    вопрос: Чем отличаются QA, QC и просто тестирование?
    категория: теория
    уровень: 1
    цель_сек: [30, 70]
    паразитов_макс: 2
    заметка: Тестирование это часть контроля качества, а QA шире и начинается раньше кода. Назови три слоя по порядку.
    тезисы:
      - текст: QA отвечает за качество процесса и старается предотвратить дефекты на всех этапах
        слова: [предотврат, предотвращ, не допуст, обеспечение качеств, обеспечивает качеств, выстраива, на всех этапах, на каждом этапе, с самого начала, на этапе требований]
        добить: А когда QA-инженер подключается к работе над продуктом?
      - текст: QC проверяет готовый продукт на соответствие требованиям
        слова: [готов продукт, готов результат, проверк готов, проверя готов, соответств требован, соответству ли, проверк результат, проверя результат]
        добить: А что такое QC и чем он занимается?
      - текст: тестирование это часть контроля качества, его работа найти дефекты
        слова: [ищем баги, ищем ошибки, ищем дефекты, находим баги, находим дефекты, найти баг, выявля, поиск дефект, поиск багов, часть qc]
        добить: А чем в этой картине занимается само тестирование?

  - id: smoke_sanity_regression
    вопрос: Чем отличаются smoke, sanity и регрессионное тестирование?
    категория: теория
    уровень: 1
    цель_сек: [40, 90]
    паразитов_макс: 2
    заметка: Эти три вида путают чаще всего. Для каждого скажи, когда его запускают и насколько он широкий.
    тезисы:
      - текст: smoke это быстрая проверка главного на новой сборке, чтобы понять, можно ли тестировать дальше
        слова: [нов сборк, свеж сборк, нов билд, свеж билд, дальше тестировать, тестировать дальше, основн функци, главн функци, критичн функци, быстр проверк главн]
        добить: С чего вы начнёте, когда разработчики выкатили очередную версию?
      - текст: sanity это узкая проверка конкретного изменения или исправления
        слова: [после фикс, после исправлен, после правк, узк проверк, проверк узк, точечн проверк, конкретн изменен, конкретн исправлен, конкретн баг, конкретн дефект]
        добить: А если поправили всего одну мелочь, полный прогон нужен?
      - текст: регрессия проверяет, что старый функционал не сломался из-за изменений
        слова: [не сломал, не поломал, старом функционале, старый функционал, старого функционала, старые функции, существующий функционал, существующего функционала, раньше работало, ранее работал]
        добить: Как убедиться, что остальной продукт после изменений работает как раньше?

  - id: test_pyramid
    вопрос: Что такое пирамида тестирования и зачем она нужна?
    категория: теория
    уровень: 2
    цель_сек: [45, 100]
    паразитов_макс: 2
    заметка: Назови слои снизу вверх и объясни, почему их размер именно такой. Фразы «так принято» мало.
    тезисы:
      - текст: внизу много быстрых юнит-тестов
        слова: [много юнит, больше юнит, больше всего юнит, лежат юнит, основ юнит, внизу юнит, внизу много, в основании много, юнит их много, фундамент юнит]
        добить: С каких тестов пирамида начинается и почему их там больше всего?
      - текст: в середине интеграционные и API-тесты, их меньше
        слова: [середин, посередин, выше интеграц, интеграц меньш, интеграцион их меньш, api-тест, api тест, апи-тест, апи тест, между юнит]
        добить: А что находится между самыми быстрыми тестами и тестами через интерфейс?
      - текст: наверху мало UI-тестов, они медленные и дорогие
        слова: [верху ui, наверху ui, верху end, наверху end, верху сквозн, наверху сквозн, верху e2e, вершин сквозн, мало ui, ui тест медленн]
        добить: Почему тестов через интерфейс в пирамиде меньше всего?
      - текст: смысл в быстрой обратной связи и недорогой поддержке
        слова: [обратную связь, обратная связь, обратной связи, быстро находить, дешевле, стоимость поддержки, затраты на поддержку, поддержку тестов, поддержки тестов, поддержка тестов]
        добить: Какую проблему решает такое распределение?

  - id: age_field_bva
    вопрос: Поле «возраст» принимает целые числа от 18 до 60. Как будете его тестировать?
    категория: тест-дизайн
    уровень: 2
    цель_сек: [50, 120]
    паразитов_макс: 2
    заметка: Называй конкретные числа на границах. Про ввод не по формату тоже не забудь.
    тезисы:
      - текст: разбить значения на классы эквивалентности, допустимые и недопустимые
        слова: [эквивалент, валидный класс, валидные значения, невалидные значения, допустимые значения, допустимый диапазон, разобью на, разбить на, делим на, классы]
        добить: Как вы разделите все возможные значения поля на группы?
      - текст: проверить границы, то есть 17, 18, 19 и 59, 60, 61
        слова: [граничн, границ, 17 18, 18 19, 59 60, 60 61, семнадцат, девятнадцат, шестьдесят один, пятьдесят девять]
        добить: Какие конкретные числа вы введёте на краях диапазона?
      - текст: из каждого класса берём по одному значению, а не перебираем все
        слова: [по одному значению, по одному представител, представител, не перебира, не нужно перебир, достаточно одного, хватит одного, одного значения, любое значение из, одно значение из]
        добить: Вы будете вводить все числа от 18 до 60 подряд?
      - текст: добавить негативные проверки, например буквы, пустое поле, отрицательное и дробное число
        слова: [буквы, буквами, буквенн, нечисловой, вместо числ, пустое поле, пустое значение, отрицательн, дробное число, спецсимвол]
        добить: А что вы введёте в это поле, кроме нормальных чисел?

  - id: decision_table
    вопрос: Когда вы используете таблицу решений?
    категория: тест-дизайн
    уровень: 2
    цель_сек: [45, 100]
    паразитов_макс: 2
    заметка: Проще объяснять на примере, например скидка зависит от статуса клиента и суммы заказа.
    тезисы:
      - текст: когда результат зависит от сочетания нескольких условий
        слова: [сочетани, комбинаци, нескольких условий, несколько условий, нескольких факторов, несколько факторов, бизнес-правил, бизнес правил, зависит от нескольких, зависит не от одного]
        добить: В каких случаях одних граничных значений вам не хватит?
      - текст: условия и действия записываются в таблицу, каждый столбец это один набор значений
        слова: [условия и действия, условия и результат, условия слева, условия сверху, условия в строках, каждый столбец, каждая колонка, каждая строка, один набор, набор значений]
        добить: Как выглядит такая таблица, что вы пишете в строках и столбцах?
      - текст: таблица помогает не пропустить комбинации и находит дыры в требованиях
        слова: [пропуст комбинац, пропуст ни одн, пропущу комбинац, пропущу ни одн, все комбинац, противореч, дыр в треб, неоднознач, неполн, схлопн]
        добить: Что вы получаете, когда таблица уже построена?

  - id: bug_report
    вопрос: Из чего состоит хороший баг-репорт?
    категория: баги и процесс
    уровень: 1
    цель_сек: [35, 80]
    паразитов_макс: 2
    заметка: Представь, что разработчик не может тебя переспросить. Репорта должно хватить, чтобы повторить баг самому.
    тезисы:
      - текст: понятный заголовок и шаги воспроизведения
        слова: [заголовок, название бага, воспроизведен, воспроизвести, пошагов, шаги, steps to reproduce, как повторить]
        добить: Как разработчик увидит баг у себя, если вас рядом не будет?
      - текст: ожидаемый и фактический результат
        слова: [ожидаем, ожидал, фактическ, expected, actual, а получил, что должно было, получилось вместо, реальный результат]
        добить: Как в репорте показать, что именно пошло не так?
      - текст: окружение и вложения, то есть версия, браузер, скриншот, видео
        слова: [браузер, устройств, версия приложения, версию приложения, версия сборки, версию сборки, видео, вложени, прикладываю скрин, приложить скрин]
        добить: Что ещё приложить, чтобы разработчику не пришлось переспрашивать?

  - id: bug_lifecycle
    вопрос: Что происходит с багом после того, как вы его завели?
    категория: баги и процесс
    уровень: 2
    цель_сек: [50, 110]
    паразитов_макс: 2
    заметка: Пройди по статусам и отдельно скажи, куда баг может вернуться. Severity и priority это разные вещи.
    тезисы:
      - текст: баг идёт по статусам от нового до закрытого, исправление перепроверяет тестировщик
        слова: [жизненный цикл, жизненного цикла, жизненном цикле, статусы, статусов, ретест, перепровер, верифиц, fixed, closed]
        добить: Через какие этапы баг проходит от заведения до закрытия?
      - текст: баг может вернуться, его переоткрывают после ретеста или отклоняет разработчик
        слова: [reopen, реопен, переоткр, откр заново, что это не баг, не является баг, так задумано, by design, не воспроизвод, отклоня]
        добить: А если разработчик не согласен или после исправления баг остался, что тогда?
      - текст: severity это тяжесть для системы, priority это срочность для бизнеса
        слова: [тяжесть, тяжел для систем, срочност, насколько срочн, серьезност, критичност, влияни на систему, влияни на бизнес]
        добить: Как вы определяете, какой баг чинить первым?

  - id: regression_no_time
