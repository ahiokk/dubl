  - id: sql_inner_left_join
    вопрос: Чем INNER JOIN отличается от LEFT JOIN и где это пригодится при проверке данных?
    категория: SQL
    уровень: 1
    цель_сек: [35, 80]
    паразитов_макс: 2
    заметка: Назови, что вернёт каждый вариант, и приведи пример, где LEFT JOIN нужен именно тестировщику.
    тезисы:
      - текст: INNER JOIN вернёт только строки, у которых есть пара в обеих таблицах
        слова: [только совпад, совпавш, совпадающ, только пересечени, оставляет пересечени, возвращ пересечени, пересечени множеств, в обеих таблиц, есть в обеих, пар в обеих]
        добить: Какие строки останутся в результате обычного соединения двух таблиц?
      - текст: LEFT JOIN вернёт все строки левой таблицы, где пары нет, там будет NULL
        слова: [все строк из лев, всех строк из лев, все из лев, лев таблиц, "null", налл, пуст значен]
        добить: А если нужны все пользователи, даже без заказов?
      - текст: в тестировании так находят записи без пары, например пользователей без заказов
