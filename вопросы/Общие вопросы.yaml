название: Общие вопросы на собеседовании в IT

# Вопросы, которые звучат почти на любом собеседовании, от стажёра до лида.
# Технических здесь нет: они зависят от роли. Банк под свою вакансию проще
# попросить у нейросети: в тренажёре кнопка «Сделать свой банк под вакансию».
#
# Под конкретную компанию скопируй банк в свой файл в этой же папке, поменяй
# название и допиши в тезисы вопроса «почему мы» её продукты. Свои банки
# в git не попадают. Заметки к вопросам показываются в окне строкой «Подсказка».

вопросы:

  - id: about_me
    вопрос: Расскажите о себе
    категория: о себе
    уровень: 1
    цель_сек: [40, 90]
    паразитов_макс: 2
    заметка: Скажи, кто ты сейчас, чем это подтверждаешь и чего хочешь от этой работы. Резюме по годам не пересказывай.
    тезисы:
      - текст: кто вы сейчас по роли и опыту
        слова: [работаю, разработчик, программист, аналитик, инженер, тестировщик, дизайнер, менеджер, учусь в универ, учусь в вуз, студент, выпускник, лет опыт, года опыт]
        добить: Кем вы работаете сейчас и сколько лет в профессии?
      - текст: результат, который можно измерить
        слова: [процент, в два раза, в три раза, вдвое, втрое, сократил, ускорил, вырос, выросл, увеличил, снизил, сэконом, повысил, точност]
        добить: Каким результатом в работе вы гордитесь?
      - текст: чего хотите от следующей работы
        слова: [ищу, хочется, хочу работать, хотел бы, расти, развива, следующей работ, следующую работ, следующее место, следующий шаг]
        добить: А чего вы ищете сейчас?

  - id: why_looking
    вопрос: Почему вы ищете новую работу?
    категория: мотивация
    уровень: 1
    цель_сек: [30, 60]
    паразитов_макс: 2
    заметка: Говори о том, куда идёшь. Прошлого работодателя не ругай.
    тезисы:
      - текст: к чему стремитесь
        слова: [расти, вырасти, развива, карьерн, масштаб, сложнее, сложные задач, сложных задач, новые задач, новых задач]
        добить: Чего вам не хватает на текущем месте?
      - текст: что успели сделать на текущем месте
        слова: [запустил, научил, освоил, получил опыт, внедрил, довел, выпустил, собрал с нуля]
        добить: Что вы успели сделать на текущем месте?
      - текст: почему именно сейчас
        слова: [самое время, сейчас удобн, сейчас подходящ, момент, закончил, завершил, перерос, потолок, уже не расту, уже не развива]
        добить: Почему решили поменять работу именно сейчас?

  - id: why_us
    вопрос: Почему вы хотите работать именно у нас?
    категория: мотивация
    уровень: 1
    цель_сек: [30, 70]
    паразитов_макс: 2
    заметка: Допиши продукты компании в слова первого тезиса. Без них ответ подойдёт к любой компании.
    тезисы:
      - текст: что знаете о компании и продукте
        слова: [ваш продукт, ваши продукты, про продукт, о продукте, ваш сервис, вашем сервисе, приложени, ваши клиент, ваших клиент, пользовател, конкурент]
        добить: Что вы знаете о нашем продукте?
      - текст: чем ваш опыт совпадает с задачами
        слова: [мой опыт, совпада, подходит, уже делал, похожие вещи, похожие задач, похожих задач, похожий проект, те же задач]
        добить: Чем ваш опыт пригодится именно здесь?
      - текст: что хотите получить сами
        слова: [научиться, поучиться, развити, нагрузк, сильной команд, сильная команд, сильных инженер]
        добить: А что эта работа даст лично вам?

  - id: proud_project
    вопрос: Расскажите о проекте, которым вы гордитесь
    категория: поведенческий
    уровень: 1
    цель_сек: [60, 120]
    паразитов_макс: 3
    заметка: Отвечай по схеме STAR, то есть ситуация, задача, действия, результат. Больше «я», меньше «мы».
    тезисы:
      - текст: какую проблему решал проект
        слова: [нужно было, была проблема, проблема была, проблема в том, решить проблем, цель была, заказчик просил, заказчик хотел, бизнесу нужн, бизнес хотел, медленно, вручную, требовалось]
        добить: Какую проблему решал этот проект?
      - текст: что сделали лично вы
        слова: [я сделал, я написал, я предложил, я отвечал, я придумал, я собрал, моя часть, лично я, я лично]
        добить: А что в этом проекте сделали лично вы?
      - текст: результат в цифрах
        слова: [процент, в два раза, в три раза, вдвое, втрое, сократ, ускор, вырос, выросл, увелич, сниз, сэконом, повыс, метрик]
        добить: Как вы измерили результат?
      - текст: что сделали бы иначе
        слова: [иначе, бы по-другому, сейчас бы, урок, вывод, не повторил]
        добить: Что бы вы сделали по-другому, если бы начинали заново?

  - id: mistake
    вопрос: Расскажите о своей ошибке и о том, что вы с ней сделали
    категория: поведенческий
    уровень: 2
    цель_сек: [45, 90]
    паразитов_макс: 2
    заметка: «Слишком много работаю» не считается. Возьми случай, когда правда ошибся, и половину ответа отдай тому, что изменилось после.
    тезисы:
      - текст: в чём была ошибка, без оправданий
        слова: [не проверил, не проверила, не учел, не учла, забыл провер, забыл добав, забыл сохран, забыл учесть, недооцен, сломал, упал, пропустил, перепутал, по моей вине]
        добить: В чём именно была ваша ошибка?
      - текст: как исправили последствия
        слова: [исправил, исправили, починил, откатил, предупредил, сообщил, признал, извинил]
        добить: Что вы сделали, когда это обнаружилось?
      - текст: что поменяли, чтобы не повторилось
        слова: [теперь у нас, теперь всегда, теперь я, с тех пор, больше не повтор, больше не допуска, больше не случал, правило, теперь проверяю, всегда проверяю, чек-лист, чеклист, добавил тест, добавили тест, написал тест, покрыл тест, автоматиз]
        добить: Что вы поменяли в работе после этого?

  - id: conflict
    вопрос: Расскажите о разногласии с коллегой или руководителем
    категория: поведенческий
    уровень: 2
    цель_сек: [45, 90]
    паразитов_макс: 2
    заметка: Спор о деле, а не о людях. Покажи, как договорились.
    тезисы:
      - текст: в чём было разногласие по делу
        слова: [не соглас, поспорил, спорили, предлагал, мы не сошлись, не сошлись во, не сошлись по, расходил, я считал, он считал]
        добить: О чём именно вы не сошлись?
      - текст: как договорились
        слова: [обсудил, аргумент, по данным, на данных, цифрами, прототип, компромисс, договорил, выслушал, созвон]
        добить: Как вы пришли к решению?
      - текст: чем закончилось
        слова: [в итоге договорились, в итоге решили, в итоге взяли, в итоге выбрали, в итоге пришли, сработал, работаем вместе, отношения остались, отношения не испортил]
        добить: Чем всё закончилось?

  - id: deadline
    вопрос: Вы понимаете, что не успеваете к сроку. Что будете делать?
    категория: поведенческий
    уровень: 2
    цель_сек: [30, 70]
    паразитов_макс: 2
    заметка: Главное здесь предупредить заранее, пока ещё можно что-то поменять.
    тезисы:
      - текст: предупредить заранее
        слова: [предупрежу, предупредить, предупреждаю, заранее сообщ, сразу сообщ, сообщу об этом, скажу об этом, заранее скажу, сообщу руковод, скажу руковод, пойду к руковод, сообщу менеджер, скажу менеджер, сообщу тимлид, скажу тимлид]
        добить: Когда и кому вы об этом скажете?
      - текст: предложить варианты
        слова: [предложу вариант, предложить вариант, несколько вариантов, два варианта, урезать, сократить объем, сократим объем, приоритетн, приоритизир, расставлю приоритет, сдвин, перенес, попрошу помощ, в помощь, mvp]
        добить: Какие варианты вы предложите?
      - текст: разобраться, почему не успели
        слова: [причин, оценк, недооцен, в следующий раз, вывод]
        добить: Как сделать, чтобы это не повторилось?

  - id: unknown_task
    вопрос: Как вы разбираетесь с задачей, в которой пока ничего не понимаете?
    категория: поведенческий
    уровень: 2
    цель_сек: [30, 70]
    паразитов_макс: 2
    тезисы:
      - текст: сначала сами, по документации и коду
        слова: [документац, исходник, в коде, читаю код, смотрю код, гугл, поиск, статьи, нейросет, chatgpt, чатгпт]
        добить: С чего вы начнёте сами?
      - текст: ограничиваете время и идёте к коллегам
        слова: [спрошу, спросить у, пойду к коллегам, обращусь к коллегам, иду к коллегам, у коллег, полчаса, пару часов, несколько часов, через час, не трачу, ограничива]
        добить: В какой момент вы пойдёте с вопросом к коллегам?
      - текст: пример из опыта
        слова: [однажды, как то раз был, как-то раз был, был случай, у меня был случай, на прошлом проекте, на прошлой работе]
        добить: Можете привести пример?

  - id: weakness
    вопрос: Какие у вас слабые стороны?
    категория: поведенческий
    уровень: 2
    цель_сек: [30, 60]
    паразитов_макс: 2
    заметка: Назови слабость, которая не мешает роли, и расскажи, что с ней делаешь.
    тезисы:
      - текст: конкретная слабость, а не замаскированная сила
        слова: [мне сложно, мне трудно, мне тяжело, плохо получается, теряюсь, не хватает, тяжело даётся, пока не умею, пока не получается, недостат, мало опыт]
        добить: А если конкретнее, что даётся тяжелее всего?
      - текст: что делаете, чтобы её закрыть
        слова: [работаю над, на курсах, курсы, прохожу курс, практик, тренир, читаю книг, прошу обратн, прошу ревью]
        добить: Что вы с этим делаете?
      - текст: уже есть сдвиг
        слова: [уже получается, уже лучше, стало лучше, стало проще, стало легче, есть прогресс, прогресс есть, теперь получается, раньше было хуже]
        добить: Есть ли уже результат?

  - id: three_years
    вопрос: Кем вы видите себя через три года?
    категория: мотивация
    уровень: 2
    цель_сек: [30, 60]
    паразитов_макс: 2
    тезисы:
      - текст: конкретная роль или уровень
        слова: [мидл, middle, сеньор, senior, тимлид, техлид, руководител, архитект, эксперт]
        добить: Какую роль вы хотите занимать?
      - текст: чему для этого надо научиться
        слова: [надо научиться, хочу научиться, предстоит научиться, освоить, прокачать, подтянуть, глубже]
        добить: Чему для этого нужно научиться?
      - текст: как с этим связана эта работа
        слова: [здесь я, у вас я, в вашей компании, эта работа даст, эта работа станет, эта позиция, эта роль, этой позиции, этой роли, эта вакансия]
        добить: Как эта работа поможет вам туда прийти?

  - id: salary
    вопрос: Какие у вас ожидания по зарплате?
    категория: мотивация
    уровень: 3
    цель_сек: [15, 45]
    паразитов_макс: 1
    заметка: Назови число или вилку сразу. Неуверенные слова здесь стоят дороже всего.
    тезисы:
      - текст: конкретное число или вилка
        слова: [тысяч, "000", рубл, на руки, вилк, миллион]
        добить: Назовите, пожалуйста, конкретную сумму.
      - текст: на чём основана сумма
        слова: [по рынку, рынок дает, рынок платит, по ваканси, смотрел ваканси, моего опыта, исходя из опыта, обязанност, уровн]
        добить: Из чего складывается эта сумма?
      - текст: что ещё важно, кроме денег
        слова: [гибк, соцпакет, соц пакет, пакет льгот, бонус, дмс, удаленк, удаленно, удаленн работ, гибрид, формат работы]
        добить: Есть ли что-то кроме денег, что для вас важно?

  - id: questions_to_us
    вопрос: Какие у вас есть вопросы к нам?
    категория: поведенческий
    уровень: 3
    цель_сек: [20, 60]
    паразитов_макс: 2
    заметка: «Вопросов нет» звучит как «мне всё равно». Подготовь два-три.
    тезисы:
      - текст: про задачи на первые месяцы
        слова: [в первые, первые недел, первые три, первые полгода, испытательн, ожидани, онбординг, буду делать, чем буду]
        добить: Что вам интересно узнать о задачах на первые месяцы?
      - текст: про команду и процессы
        слова: [о команде, в вашей команде, о вашей команде, процессы, ревью, релиз, спринт, кто будет]
        добить: А про команду ничего не хотите спросить?
      - текст: как поймут, что вы справляетесь
        слова: [успех, оцениваете, оцениваться, метрик, справля, критери, повышени]
        добить: Вам не интересно, как у нас оценивают работу новичков?
