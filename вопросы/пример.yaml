название: Пример банка, как это устроено

# Один вопрос со всеми полями. Настоящие банки под конкретные компании
# в репозиторий не попадают, они личные.

вопросы:

  - id: corr_cov
    вопрос: Чем корреляция отличается от ковариации?
    категория: статистика        # тема для фильтра в окне
    уровень: 1                   # 1 разминка, 2 рабочий, 3 боевой
    цель_сек: [30, 60]           # целевая длительность ответа
    паразитов_макс: 2            # сколько слов-паразитов можно
    заметка: Показывается в окне под вопросом строкой «Подсказка».
    тезисы:
      - текст: ковариация зависит от единиц измерения
        # маркеры в разных формах и с обрезанными окончаниями:
        # распознавание отдаёт то «масштаб», то «масштабе»
        слова: [единиц, масштаб, размерност, шкал]
        # если тезис не прозвучал, программа задаст этот вопрос
        добить: От чего зависит величина ковариации?
      - текст: корреляция это нормированная ковариация
        слова: [нормир, делен, стандартн отклонен, сигм]
        добить: Как одно получается из другого?
      - текст: корреляция лежит от минус единицы до единицы
        слова: [минус един, до един, диапазон, ограничен]
        добить: В каких пределах лежит корреляция?
