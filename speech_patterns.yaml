# Словари для разбора речи. Пополняй по мере того, как ловишь за собой новое.
# Своё удобнее писать в speech_patterns.local.yaml рядом: он не попадает в git,
# его списки дописываются к этим, а подмены дополняют здешние.
# Слова ищутся целиком: «ну» не сработает внутри «нужно».

# Слова-паразиты. Ловятся всегда, чем меньше, тем лучше.
паразиты:
  - ээ
  - эээ
  - э-э
  - эм
  - эмм
  - мм
  - ммм
  - а-а
  - ну
  - вот
  - типа
  - как бы
  - короче
  - это самое
  - так сказать
  - допустим
  - скажем так
  - собственно

# Обороты, которыми ты обесцениваешь собственный ответ.
самоподрезание:
  - наверное
  - мне кажется
  - возможно
  - может быть
  - вроде бы
  - не уверен
  - не уверена
  - я не эксперт
  - поверхностно
  - я слаб
  - я слабо
  - немного знаю
  - чуть-чуть
  - как-то так
  - если честно
  - я только начал
  - плохо разбираюсь
  - не силён

# Обороты-связки. Сами по себе нормальны, вредны только в избытке,
# поэтому считаются отдельно от паразитов и без приговора.
связки:
  - значит
  - в общем
  - то есть
  - в принципе
  - соответственно
  - на самом деле

# Слова, которые ты произносишь неправильно. Слева сказанное, справа верное.
подмены:
  питон: Python

# Ориентиры темпа речи, слов в минуту.
темп:
  медленно: 90
  быстро: 160
